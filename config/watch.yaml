# Конфигурация Слак-агента «Глебот».
# Единственное место, где меняются каналы, тон, лимиты и Jira-настройки.
# Правки здесь применяются со следующего часового цикла — код трогать не нужно.

persona:
  # Имя, под которым агент представляется в тредах.
  name: "Глебот"
  # Префикс каждого сообщения агента. По нему же агент узнаёт свои старые
  # сообщения, поэтому менять его — значит потерять историю: агент перестанет
  # видеть, что он уже отвечал в треде. Меняй только вместе с чисткой pending.
  prefix: ":robot_face: *Глебот* (AI-помощник Глеба):"
  # Как агент говорит: дружелюбно, по делу, без канцелярита и без извинений.
  # Подробные правила тона — references/replies.md
  language: ru

owner:
  slack_id: "U0BK99FCH7F"
  display_name: "Gleb.M"
  # Канал, куда падают черновики на одобрение. Это Slack-«заметки себе»
  # (личный DM с самим собой) — id совпадает с user_id владельца.
  inbox_channel: "U0BK99FCH7F"

workspace:
  domain: "cobaltlabworkspace"

channels:
  - id: "C099240QR3N"
    name: "разработка-обсуждение"
    # active   — агент разбирает и предлагает ответы в тред
    # digest   — агент только включает в сводку, в тред не пишет никогда
    # off      — канал не читается вовсе
    mode: active
    note: "Основной поток: баги с прода, вопросы к продукту, координация."

  - id: "C099GHLHAJV"
    name: "qa-баги"
    mode: active
    note: "Баг-репорты от QA. Почти всё здесь — кандидаты в Jira."

  - id: "C0AU59E1N9H"
    name: "dev-кабан"
    mode: digest
    note: "Приватный. Пока только читаем в сводку, в тред не лезем."

limits:
  # Сколько сообщений максимум вычитывать из одного канала за цикл.
  max_messages_per_channel: 50
  # Сколько черновиков максимум готовить за один цикл. Защита от того,
  # чтобы после долгого простоя не завалить инбокс сорока карточками.
  max_drafts_per_cycle: 6
  # Сообщения старше этого возраста не разбираются: поезд ушёл,
  # влезать в позавчерашний тред — только раздражать людей.
  max_message_age_hours: 24
  # Черновик, который провисел без ответа дольше этого срока, отменяется.
  draft_expiry_hours: 24

behavior:
  # false — агент никогда не постит в канал без явного «ок» от владельца.
  # Это текущий режим обкатки. Переключать только когда классификация
  # и тон устоятся на реальном потоке.
  autopost_without_approval: false
  # Даже при autopost_without_approval: true эти классы всё равно
  # требуют одобрения.
  always_require_approval: ["TASK", "QUESTION"]
  # Не влезать в тред, где уже идёт живой разговор: если по существу
  # ответили столько раз или больше — агент молчит (кроме прямого тега).
  skip_thread_if_replies_gte: 3

jira:
  cloud_id: "17dd2886-d35b-422f-bb2c-0f0745c08d35"
  site: "teamteh.atlassian.net"
  project_key: "TEAMDEV"
  issue_type_bug: "Баг"
  issue_type_task: "Зaдача"   # да, именно так, с кириллической «a» — так заведено в проекте
  # false — агент только показывает заготовку тикета в черновике.
  # Реальный issue создаётся, когда владелец отвечает «ок+жира».
  create_without_approval: false

digest:
  # Присылать сводку, даже если разбирать было нечего.
  send_when_empty: false
